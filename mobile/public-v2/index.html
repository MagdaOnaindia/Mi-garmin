<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Garmin">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Mi Garmin</title>
<style>
/* Estilo iOS agrupado: fondo gris, tarjetas blancas, un color fijo por tema */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#6C6C70; --ink3:#AEAEB2; --sep:#E3E3E8; --fill:#EDEDF2; --mus:#DCDCE3; --skin:#EEEEF2;
  --tint:#0B7A75; --sleep:#5E5CE6; --rec:#1FA38F; --heart:#F2385A; --train:#F28C0F; --food:#2FB350; --cycle:#D4467C;
  --str:#8B5CF6; --water:#1BA7D6; --prot:#E84D8A; --sun:#E0A100;
  /* macros: proteína rosa, hidratos morado, grasa azul, fibra gris cálido (nunca amarillo: se confunde con el nivel medio) */
  --carb:#9B5DE5; --fat:#3557E8; --fib:#8C857A; --kcal:var(--rec);
  --ok:#2FB350; --warn:#E8890C; --bad:#E5342B;
  --dim:rgba(0,0,0,.4);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F5F5F7;--ink2:#98989F;--ink3:#5C5C61;--sep:#2C2C2F;--fill:#2C2C2E;--mus:#3A3A3F;--skin:#262628;--tint:#3CC4BA;--prot:#FF6FA8;--carb:#B07CFF;--fat:#5C7CFF;--kcal:var(--rec);--water:#4CC9F0;--fib:#B8B2A7;--sleep:#7D7AFF;--rec:#38C6B0;--str:#A78BFA;--dim:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 var(--f);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px;border-radius:8px}
svg.i{width:1em;height:1em;flex:none}
.view{display:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(96px + env(safe-area-inset-bottom,0px))}
.view.on{display:block}
.nav{padding:4px 18px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.nav .sub{font-size:13px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.nav h1{font-family:var(--fd);font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.nav .acts{display:flex;gap:8px;align-items:center}
.back{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;padding:0 12px 4px;min-height:44px}
.dayrow{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 16px 6px}
.daynav{display:flex;align-items:center;gap:4px;width:100%;max-width:340px;height:48px;background:var(--card);border-radius:14px;padding:2px;font-size:15px;color:var(--ink)}
.daynav button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--tint);flex:none}
.daynav button:active{background:var(--fill)}
.daynav button:disabled{color:var(--ink3);opacity:.45}
.daynav svg{width:13px;height:13px}
.daynav .dnl{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.daynav .dnl .dd{color:var(--ink2);font-weight:500}
.daynav .dnl:focus-within{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent)}
.daynav .dnl svg{color:var(--ink2);width:10px;height:10px}
.daynav input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.dntoday{min-height:36px;padding:0 10px;font-size:14px;font-weight:600;color:var(--tint)}
.back svg{transform:rotate(180deg);width:14px;height:14px}
.circ{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--tint)}
.circ svg{width:19px;height:19px}
.circ.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.circ.spin svg{animation:none}}
.textbtn{color:var(--tint);font-size:16px;min-height:36px;display:inline-flex;align-items:center}
.syncline{font-size:12.5px;color:var(--ink2);padding:0 18px 6px;display:flex;align-items:center;gap:6px;min-height:20px}
.syncline i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.syncline i.w{background:var(--warn)}
.body{padding:6px 16px 18px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:10px 4px -2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec button{font-size:15px;font-weight:500;color:var(--tint)}
.card{background:var(--card);border-radius:16px;padding:14px 16px}
.card.tight{padding:0}
button.card{display:block;width:100%}
button.card.ins{display:flex}
.ch{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.ch svg{width:17px;height:17px}
.ch .more{margin-left:auto;color:var(--ink3);font-weight:500;font-size:13px;display:flex;align-items:center;gap:2px}
.ch .more svg{width:12px;height:12px}
.big{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:3px}
.mute{color:var(--ink2);font-size:13px}
p.mute{margin:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;width:100%;min-height:48px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--ink2)}
button.card>.chev,.row .chev,.ins .chev{width:12px;height:12px;flex:none;color:var(--ink3)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:18px;height:18px}
.ico.round{border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--ok) 15%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.pill.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:color-mix(in srgb,var(--warn) 85%,var(--ink))}
.pill.b{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.t{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;font-size:13px;font-weight:600}
.seg button{flex:1;text-align:center;padding:7px 0;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;min-width:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.tile .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.tile .t svg{width:15px;height:15px}
.tile .v{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile .v small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:2px;letter-spacing:0}
.ins{display:flex;gap:12px;align-items:flex-start;text-align:left}
.ins b{display:block;font-size:15px;margin-bottom:2px}
.ins p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.35}
.ins .grow{flex:1;min-width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{background:var(--fill);border-radius:10px;padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--ink2);min-height:52px}
.scale button b{display:block;font-size:17px;color:var(--ink)}
.scale button.on{background:var(--tint);color:#fff}
.scale button.on b{color:#fff}
.tog{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.tog.on{background:var(--ok)}
.tog.on::after{left:22px}
.stepper{display:flex;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:44px;text-align:center;padding:6px 0;font-size:19px;font-weight:500}
.stepper button+button{border-left:1px solid var(--sep)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:500;min-height:36px}
.chip svg{width:15px;height:15px}
.chip.on{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.chip.cy{background:color-mix(in srgb,var(--cycle) 14%,transparent);color:var(--cycle)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--tint);color:#fff;border-radius:12px;text-align:center;font-weight:600;padding:14px;width:100%;display:block}
.btn.sec2{background:var(--fill);color:var(--tint)}
.btn.danger{background:var(--fill);color:var(--bad)}
.btn:disabled{opacity:.5}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.weekstrip div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink2);font-weight:600}
.weekstrip .d{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--ink);font-weight:600}
.weekstrip .today .d{background:var(--tint);color:#fff}
.weekstrip .mk{display:flex;gap:2px;height:6px}
.weekstrip .mk i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-weight:600}
.meal .it{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.meal .it span:last-child{color:var(--ink2);flex:none}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:10px 4px}
.lock{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2);margin-top:6px}
.lock .bar{flex:1;height:6px}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg.chart text{font-family:var(--f);font-size:10px;fill:var(--ink2)}
.readout{font-size:13px;color:var(--ink2);min-height:18px}
.readout b{color:var(--ink)}
input.f,textarea.f,select.f{width:100%;background:var(--fill);border:0;border-radius:10px;padding:11px 12px;font-size:16px}
textarea.f{min-height:70px;resize:vertical}
/* iOS da a los campos de hora y fecha un ancho mínimo propio que se sale de la tarjeta */
input.f[type=time],input.f[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input.f::-webkit-date-and-time-value{text-align:left}
.card>div{min-width:0}
/* Agua: una línea fina */
.water{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px}
.water>svg{width:16px;height:16px;color:var(--water);flex:none}
.water .wl{flex:1;min-width:0;display:grid;gap:5px}
.water .wt{display:flex;justify-content:space-between;font-size:13.5px;gap:6px}
.water .wt b{font-weight:600}
.water .wb{height:4px;border-radius:2px;background:color-mix(in srgb,var(--water) 14%,transparent);overflow:hidden}
.water .wb i{display:block;height:100%;border-radius:2px;background:var(--water);transition:width .3s}
.water .wbtn{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--water) 12%,transparent);color:var(--water);display:grid;place-items:center;font-size:18px;font-weight:600;flex:none;line-height:1}
/* Ánimo: registros del día */
.moods{display:grid;gap:2px}
.moods .me{display:flex;gap:10px;align-items:baseline;font-size:13.5px;padding:5px 0}
.moods .me+.me{border-top:1px solid var(--sep)}
.moods .me time{color:var(--ink2);width:42px;flex:none;font-weight:600}
.moods .me .dots{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
/* Medidas */
.mtile{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;gap:3px;text-align:left;min-width:0}
.mtile .t{font-size:13px;font-weight:600;color:var(--ink2)}
.mtile .v{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.02em}
.mtile .v small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:2px;letter-spacing:0}
.mtile .v.no{color:var(--ink3)}
.bigin{font-family:var(--fd);font-size:40px;font-weight:700;text-align:center;width:100%;background:var(--fill);border:0;border-radius:14px;padding:10px;color:var(--ink)}
.stepper.lg button{width:64px;padding:10px 0;font-size:24px}
.stepper.sm button{width:30px;padding:4px 0;font-size:17px}
.stepper.sm button.v{width:auto;min-width:46px;padding:4px 6px;font-size:13.5px;font-weight:600}
.rmx{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink2);flex:none}
.rmx svg{width:11px;height:11px}
details>summary::-webkit-details-marker{display:none}
details>summary::marker{content:''}
input.num{width:64px;text-align:center;background:var(--fill);border:0;border-radius:8px;padding:8px 4px;font-size:16px}
label.fl{font-size:13px;color:var(--ink2);font-weight:600;display:block;margin:0 0 6px 4px}
/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:7px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 86%,transparent);border-top:1px solid var(--sep);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);width:68px;min-height:44px}
.tabbar svg{width:26px;height:26px}
.tabbar .on{color:var(--tint)}
/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:none}
.sheet-wrap.on{display:block}
.sheet-dim{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .25s}
.sheet-wrap.show .sheet-dim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:min(76%,calc(100% - env(safe-area-inset-top,0px) - 14px));background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:700px;margin:0 auto}
.sheet-wrap.show .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-dim{transition:none}}
.sheet.tall{max-height:calc(100% - env(safe-area-inset-top,0px) - 14px);height:calc(100% - env(safe-area-inset-top,0px) - 14px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:7px auto 2px;flex:none}
.sheethd{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:4px 14px 6px;flex:none}
.sheethd b{font-size:17px;text-align:center}
.sheethd .l{color:var(--tint);font-size:16px;text-align:left;min-height:40px}
.sheethd .r{color:var(--tint);font-size:16px;text-align:right;font-weight:600;min-height:40px;justify-self:end}
.sheethd .x{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2);justify-self:end}
.sheethd .x svg{width:12px;height:12px}
.sheet .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ed-row{display:flex;gap:8px;align-items:center;padding:8px 12px}
.ed-row+.ed-row{border-top:1px solid var(--sep)}
.ed-row input{flex:1;min-width:0}
.ed-row .mv{width:32px;height:32px;border-radius:8px;background:var(--fill);display:grid;place-items:center;color:var(--ink2)}
.ed-row .mv svg{width:12px;height:12px}
.help h3{font-size:15px;margin:0 0 4px}
.help p{margin:0 0 4px;font-size:14px;color:var(--ink2);line-height:1.4}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-today" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="13" r="9"/><path d="M13 4a9 9 0 0 1 9 9"/><circle cx="13" cy="13" r="3.2" fill="currentColor" stroke="none"/></symbol>

  <symbol id="i-train" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 13h10"/><rect x="4.5" y="8.5" width="3.5" height="9" rx="1.2"/><rect x="18" y="8.5" width="3.5" height="9" rx="1.2"/><path d="M2.5 11v4M23.5 11v4"/></symbol>
  <symbol id="i-food" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h18a9 9 0 0 1-18 0Z"/><path d="M10 9c0-2 2-2 2-4M14.5 9c0-2 2-2 2-4"/></symbol>
  <symbol id="i-diary" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="15" height="19" rx="2.5"/><path d="M9.5 9h7M9.5 13h7M9.5 17h4"/></symbol>
  <symbol id="i-sync" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 0 1-10.4 4.1M4 10a6 6 0 0 1 10.4-4.1"/><path d="M14.6 2.8v3.3h-3.3M5.4 17.2v-3.3h3.3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 20 20" fill="currentColor"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1Z"/></symbol>

// Hora en minutos desde las 18:00 (así las 00:30 van después de las 23:30)
const clockMin = iso => { if (!iso) return null; const m = +String(iso).slice(11, 13) * 60 + +String(iso).slice(14, 16); return m < 18 * 60 ? m + 360 : m - 1080; };

    wakeAvg: fromClock(mean(wake) - 1080 + 1440), wakeSd: Math.round(sd(wake)), wakeRange: [fromClock(Math.min(...wake) - 1080 + 1440), fromClock(Math.max(...wake) - 1080 + 1440)],

    const L = exLib(), P = plans(), U = exUndefined(), seen = exSeen(), used = new Set(), mine = new Set(myExercises());
    const row = n => { const e = L[n], l = exHistory(n).pop();
      return `<button class="row" data-exn="${esc(n)}"><div class="lbl">${esc(n)}<div class="mute">${e && e.main.length ? e.main.map(k => MUS_ES[k]).join(', ') : 'Sin músculos'}${l ? ` · ${l.x.kg != null ? fkg(l.x.kg) + ' kg × ' + (l.x.reps ?? '—') : (l.x.reps ?? '—') + ' reps'} · ${short(l.date)}` : ''}</div></div>${ic('chev', 'chev')}</button>`; };
    const groups = [['Push', 'Push'], ['Pull', 'Pull'], ['Legs', 'Legs'], ['Fuerza', 'Cadera y core'], ['Movilidad', 'Movilidad']].map(([k, lbl]) => {
      const ns = [...new Set((P[k] || []).map(exCanon))].filter(n => L[n] && !used.has(n)); ns.forEach(n => used.add(n)); return [lbl, ns]; });
    const rest = Object.keys(L).filter(n => mine.has(n) && !used.has(n) && !U.includes(n)).sort((a, b) => a.localeCompare(b, 'es'));
    $('exBody').innerHTML = `${U.length ? `<div class="sec" style="margin-top:0">Sin definir <span class="pill t">${U.length}</span></div>
        <div class="card help" style="padding:10px 14px"><p>Llegaron del reloj sin un nombre tuyo o no tienen músculos. Tócalos para decir qué ejercicio son.</p></div>
        <div class="card tight">${U.map(n => { const s = seen.get(n); return `<button class="row" data-exn="${esc(n)}" data-new="1"><div class="lbl">${esc(n)}<div class="mute">${s ? `${s.watch ? 'Del reloj' : 'Apuntado'} · ${s.n} ${s.n === 1 ? 'vez' : 'veces'} · ${short(s.date)}` : 'Sin músculos'}</div></div><span class="pill t">Definir</span></button>`; }).join('')}</div>` : ''}
      ${groups.filter(g => g[1].length).map(([lbl, ns]) => `<div class="sec">${lbl}</div><div class="card tight">${ns.map(row).join('')}</div>`).join('')}
      ${rest.length ? `<div class="sec">Otros</div><div class="card tight">${rest.map(row).join('')}</div>` : ''}

    $('exBody').querySelectorAll('[data-exn]').forEach(b => b.onclick = () => exEdit(b.dataset.exn, exercisesSheet, !!b.dataset.new));
    $('exNew').onclick = () => exEdit(null, exercisesSheet);
  };
  openSheet({title: 'Mis ejercicios', body: '<div id="exBody" style="display:grid;gap:12px"></div>', onRender: draw});

// Editar (o crear) un ejercicio: nombre, nota, músculos tocando el cuerpo o los chips, nombres en el reloj y su progreso
function exEdit(name, back, fromWatch){
  const L = exLib(), e = name && L[name], seen = name && exSeen().get(name), guess = name && !e ? exMuscles(name, seen && seen.cat) || {} : {};
  const st = {name: name || '', desc: e ? e.desc : '', main: e ? [...e.main] : Object.keys(guess).filter(k => guess[k] >= 3), sec: e ? [...e.sec] : Object.keys(guess).filter(k => guess[k] < 3),
    alias: e ? [...e.alias] : [], same: ''};
  const cycle = k => { if (st.main.includes(k)) { st.main = st.main.filter(x => x !== k); st.sec.push(k); } else if (st.sec.includes(k)) st.sec = st.sec.filter(x => x !== k); else st.main.push(k); };
  const draw = () => {
    const tot = Object.fromEntries([...st.sec.map(k => [k, .4]), ...st.main.map(k => [k, 1])]), H = name ? exHistory(name) : [];
    $('exEd').innerHTML = `${!name ? `<div class="card" style="display:grid;gap:8px"><label class="fl" for="exCat" style="margin-left:0">Del catálogo (opcional)</label>
          <select class="f" id="exCat"><option value="">Escribirlo yo</option>${Object.keys(BANK_EX).filter(n => !myExercises().includes(n)).sort((a, b) => a.localeCompare(b, 'es')).map(n => `<option ${st.name === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}${fromWatch ? `<div class="card" style="display:grid;gap:8px"><b>¿Es uno de tus ejercicios?</b><p class="mute">Si en el reloj sale «${esc(name)}» pero en realidad es otro, elígelo y la app lo traducirá siempre.</p>
          <select class="f" id="exSame" aria-label="Es el mismo que"><option value="">No, es un ejercicio nuevo</option>${Object.keys(L).sort((a, b) => a.localeCompare(b, 'es')).map(n => `<option ${st.same === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}
      ${st.same ? '' : `<div class="card" style="display:grid;gap:10px"><div><label class="fl" for="exName">Nombre</label><input class="f" id="exName" value="${esc(st.name)}" maxlength="60" placeholder="Por ejemplo: Remo con mancuerna"></div>
        <div><label class="fl" for="exDesc">Nota</label><textarea class="f" id="exDesc" rows="2" maxlength="200" placeholder="Cómo se hace o qué máquina">${esc(st.desc)}</textarea></div></div>
      <div class="card" style="display:grid;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Músculos</b><span class="mute" style="font-size:12px">Toca: principal → secundario → quitar</span></div>
        <div id="exMap">${bodySvg(tot, {pick: true, w: 260, h: 240})}</div>
        <div class="chips" style="justify-content:center">${Object.keys(MUS).map(k => { const m = st.main.includes(k), s = st.sec.includes(k);
          return `<button class="chip" data-mu="${k}" aria-pressed="${m || s}" style="min-height:32px;padding:5px 11px;font-size:13px;${m ? 'background:var(--str);color:#fff' : s ? 'background:color-mix(in srgb,var(--str) 22%,transparent)' : ''}">${MUS_ES[k]}${m ? ' · 1º' : s ? ' · 2º' : ''}</button>`; }).join('')}</div></div>
      <div class="card" style="display:grid;gap:8px"><b>Cómo sale en el reloj</b><p class="mute">Otros nombres con los que llega de Garmin (por ejemplo «Bíceps» o «Aperturas»). La app los cambia por este.</p>
        ${st.alias.length ? `<div class="chips">${st.alias.map((a, i) => `<span class="chip" style="min-height:30px;padding:4px 6px 4px 12px">${esc(a)}<button class="rmx" data-al="${i}" aria-label="Quitar ${esc(a)}">${ic('x')}</button></span>`).join('')}</div>` : ''}
        <div style="display:flex;gap:8px"><input class="f" id="exAl" maxlength="60" placeholder="Nombre en el reloj"><button class="btn sec2" id="exAlAdd" style="width:auto;padding:0 16px">Añadir</button></div></div>
      ${H.length ? `<div class="card" style="display:grid;gap:8px"><div class="ch">Progreso<span class="more">1RM estimado</span></div>
        ${H.some(h => h.x.kg) ? lineChart(H.filter(h => h.x.kg).map(h => ({x: short(h.date), full: `${short(h.date)} · ${fkg(h.x.kg)} kg × ${h.x.reps ?? '—'}`, y: Math.round(e1rm(h.x) * 10) / 10})), {col: 'var(--str)', unit: 'kg', dec: 1, label: 'Progreso de ' + (name || '')}) : '<p class="mute">Apunta kilos para ver la gráfica.</p>'}
        <div style="display:grid;gap:2px;font-size:13px">${H.slice(-5).reverse().map(h => `<div style="display:flex;justify-content:space-between"><span class="mute">${short(h.date)}</span><span>${h.x.series || 1} × ${h.x.reps ?? '—'}${h.x.kg != null ? ' · ' + fkg(h.x.kg) + ' kg' : ''}</span></div>`).join('')}</div></div>` : ''}
      ${e && !e.def ? '<button class="btn danger" id="exDel">Borrar de mis ejercicios</button>' : ''}`}`;

    if ($('exCat')) $('exCat').onchange = ev => { const c = BANK_EX[ev.target.value]; if (c) Object.assign(st, {name: ev.target.value, desc: c.d || '', main: [...(c.m || [])], sec: [...(c.s || [])], alias: [...(c.a || [])]}); draw(); };
    if ($('exSame')) $('exSame').onchange = ev => { st.same = ev.target.value; draw(); };
    if (st.same) return;
    $('exName').oninput = ev => st.name = ev.target.value; $('exDesc').oninput = ev => st.desc = ev.target.value;
    b.querySelectorAll('[data-mu]').forEach(x => x.onclick = () => { cycle(x.dataset.mu); draw(); });
    $('exMap').onclick = ev => { const p = ev.target.closest('[data-sl]'); if (!p) return; const ks = Object.keys(MUS).filter(k => MUS[k][1] === p.dataset.sl);

  };

    onLeft: () => back ? back() : closeSheet(),
    onRight: async () => {
      const X = {...(settings().exercises || {})}, cur = exLib();
      if (st.same) { const t = cur[st.same]; X[st.same] = {desc: t.desc, main: t.main, sec: t.sec, alias: [...new Set([...t.alias, name])]};
        await saveSettings({exercises: X}); back ? back() : closeSheet(); return toast(`«${name}» es ${st.same}`); }

      if (n !== name && cur[n]) return toast('Ya tienes un ejercicio con ese nombre');

      const patch = {};
      if (name && n !== name && cur[name]) { if (DEF_EX[name]) X[name] = {hide: true}; else delete X[name];   // renombrar: el nombre viejo pasa a ser otro nombre del nuevo
        const pl = settings().plans || {}, np = {}; for (const [k, v] of Object.entries(pl)) if (v.includes(name)) np[k] = v.map(x => x === name ? n : x); if (Object.keys(np).length) patch.plans = np; }
      X[n] = {desc: st.desc.trim(), main: st.main, sec: st.sec, alias};
      await saveSettings({...patch, exercises: X}); back ? back() : closeSheet(); toast('Guardado');
    }});
}
// «Más»: lo que no hace falta ver cada día
function entrenoMore(){

  const since = addDays(t, -13), R = S.filter(s => s.date >= since);
  const rows = [['Push', 'Push'], ['Pull', 'Pull'], ['Legs', 'Legs'], ['Fuerza', 'Cadera y core'], ['Funcional', 'Funcional']].map(([k, l]) => { const lastS = S.filter(s => s.kind === k).pop();
    return {k, l, n: R.filter(s => s.kind === k).length, ago: lastS ? daysBetween(lastS.date, t) : null}; });

  openSheet({title: 'Entreno', body: `<div class="sec" style="margin-top:0">Sesiones</div>${SL.length ? `<div class="card tight">${SL.map(sessRow).join('')}</div>` : '<div class="card empty">Aún no hay sesiones.</div>'}

      return `<button class="row" data-prog="${k}"><div class="ico" style="background:${KCOL[k]}">${ic('train')}</div><div class="lbl">${k === 'Fuerza' ? 'Cadera y core' : k}<div class="mute">${(plans()[k] || []).length} ejercicios${n ? ` · sube peso en ${n}` : ''}</div></div>${ic('chev', 'chev')}</button>`; }).join('')}</div>
    ${W.some(w => w.srpe) ? `<div class="card" style="display:grid;gap:6px"><div class="ch">Carga de las últimas semanas</div>${lineChart(W.map(w => ({x: short(w.week), full: 'Semana del ' + short(w.week), y: w.srpe})), {bars: true, col: 'var(--train)', unit: 'sRPE', label: 'Carga semanal', min: 0})}<p class="mute">Carga = minutos × esfuerzo (RPE).</p></div>` : ''}

      <button class="row" data-help="grabar"><div class="lbl">Cómo grabar cada sesión en el reloj</div>${ic('chev', 'chev')}</button></div>`,

}

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const scaleNut = (nut, m) => { const o = {}; for (const k in nut || {}) o[k] = nut[k] * m; return o; };
const addNutTo = (a, b) => { for (const k in b || {}) a[k] = (a[k] || 0) + b[k]; return a; };
const ptLabel = (qty, pn) => `${fmt(qty, qty % 1 ? 2 : 0)} ${pn === 'g' || pn === 'ml' ? pn : '× ' + pn}`;
let FIDX = [], BYID = {};
function buildFoodIdx(){
  const uses = {}; (FOOD_HIST.entries || []).forEach(e => { uses[e.fid] = (uses[e.fid] || 0) + 1; });
  FIDX = [...(MYFOODS || []), ...((NUTDB && NUTDB.foods) || [])];
  BYID = Object.fromEntries(FIDX.map(f => [f.id, f]));
  FIDX.forEach(f => { f._u = 3 * (uses[f.id] || 0); f._s = norm(`${f.n} ${f.brand || ''} ${f.g || ''}`); if (!f.pt || !f.pt.length) f.pt = [{n: f.base || 'ración', f: 1}];
    // siempre se puede apuntar en gramos (o ml) si los valores son por 100
    const u = f.base === '100 g' ? 'g' : f.base === '100 ml' ? 'ml' : null; if (u && !f.pt.some(x => x.n === u)) f.pt = [{n: u, f: .01}, ...f.pt]; });
}
async function ensureFoodData(){

function addResults(){

    return {list: [...seen.values()].filter(e => !toks.length || toks.every(t => norm(e.name).includes(t))).slice(0, 40).map(e => ({f: BYID[e.fid], pre: {pn: e.pn, qty: e.qty}}))};

// --- Escáner de código de barras (cámara con ZXing; si no hay cámara, se escribe el número) ---
let SCAN = null;
function stopScan(){ try { SCAN && SCAN.reset(); } catch {} SCAN = null; }
function scanSheet(opt = {}){
  openSheet({title: 'Escanear', left: opt.back ? 'Atrás' : 'Cancelar', onLeft: opt.back ? () => { stopScan(); opt.back(); } : null, onClose: stopScan,
    body: `<div class="card" style="padding:0;overflow:hidden;background:#000;border-radius:16px"><video id="scVideo" playsinline muted style="display:block;width:100%;aspect-ratio:4/3;object-fit:cover"></video></div>
      <p class="mute" id="scMsg" style="padding:0 4px;text-align:center">Apunta al código de barras del envase.</p>
      <div class="card" style="display:flex;gap:8px;align-items:center"><input class="f" id="scCode" inputmode="numeric" placeholder="O escribe el número" aria-label="Número del código de barras"><button class="btn" id="scGo" style="width:auto;padding:11px 16px">Buscar</button></div>`,
    onRender: async b => {
      b.querySelector('#scGo').onclick = () => lookupCode(b.querySelector('#scCode').value, opt);
      try {
        if (!window.ZXing) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js'; s.integrity = 'sha384-0ASr5PEWAMtTnWsn0PzKmioHVDA4+QqFiJr94io/0DCrGP6E1gRAmbO6O8y5WZW9'; s.crossOrigin = 'anonymous'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
        if (!$('scVideo')) return;
        const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
        SCAN = new ZXing.BrowserMultiFormatReader(hints);
        await SCAN.decodeFromConstraints({video: {facingMode: 'environment'}}, $('scVideo'), res => { if (res) { stopScan(); lookupCode(res.getText(), opt); } });
      } catch { const m = $('scMsg'); if (m) m.textContent = 'No puedo abrir la cámara. Escribe el número del código.'; }
    }});
}
async function lookupCode(code, opt){
  code = String(code || '').replace(/\D/g, ''); if (!code) return;
  const m = $('scMsg'); if (m) m.textContent = `Buscando ${code}…`;
  await ensureFoodData();
  try {
    const r = await fetch('/api/food/barcode?code=' + code, {credentials: 'same-origin'});
    if (r.status === 401) { location.href = '/login'; return; }
    const f = await r.json().catch(() => ({}));
    stopScan();
    if (r.status === 404) { toast('No está en Open Food Facts: créalo con la etiqueta'); return foodForm(null, {code, src: 'etiqueta, código ' + code}, {back: opt.back, thenQty: ADDST.mode === 'log'}); }
    if (!r.ok) { if (m) m.textContent = 'No se pudo buscar: ' + (f.error || r.status); return; }
    if (f.known && BYID[f.id]) return qtySheet(BYID[f.id], {back: opt.back});
    toast('Encontrado: revisa los valores y guarda');
    foodForm(null, f, {back: opt.back, thenQty: true});
  } catch { if (m) m.textContent = 'No se pudo buscar. ¿Hay conexión?'; }
}

// Vitamina D por el sol: 30 min a mediodía con cara y brazos al aire, en Madrid (~40° N), piel media y sin crema.
// Muy aproximado (µg por mes; 1 µg = 40 UI). De noviembre a febrero el sol está demasiado bajo para fabricarla.
const SUN_VITD = [0, 0, 7.5, 15, 25, 25, 25, 25, 15, 7.5, 0, 0];
const sunVitD = date => logVal(date, 'habit', 'aire_libre') === 1 ? SUN_VITD[+date.slice(5, 7) - 1] : 0;
const sunNote = date => { const v = SUN_VITD[+date.slice(5, 7) - 1];
  return v ? `≈ ${fmt(v, v % 1 ? 1 : 0)} µg (${fmt(v * 40)} UI) de vitamina D por el sol, estimado` : 'En esta época el sol de Madrid apenas da vitamina D'; };
const lastLogBefore = (key, date) => LOG.filter(e => e.kind === 'metric' && e.key === key && e.date < date).sort((a, b) => a.date.localeCompare(b.date)).pop() || null;
const stepDec = st => st < 1 ? (String(st).split('.')[1] || '').length : 0;

function openHelp(k){ const h = HELP[k]; if (!h) return; store.set('help_' + k, 1); openSheet({title: h[0], body: h[1] + '<button class="btn" data-close style="margin-top:4px">Entendido</button>'}); }
function maybeFirstHelp(t){ if (HELP[t] && !store.get('help_' + t, 0) && D) setTimeout(() => { if (TAB === t && !SHEET) openHelp(t); }, 600); }

/* ---------- carga ---------- */
async function loadData(){ try { D = await api('/api/data'); } catch (e) { if (e.message === 'login') return; } }
async function loadAll(){
  const local = store.get('train', null);
  await Promise.all([
    loadData(),
    api('/api/log').then(x => LOG = x).catch(() => {}),
    api('/api/config').then(x => CFG = x).catch(() => {}),
    api('/api/mood').then(x => MOODS = x).catch(() => {}),
    api('/api/aviso-salud').then(x => AVISO = x).catch(() => { AVISO = null; }),
    api('/api/food/goals').then(x => FGOALS = x).catch(() => {}),
    api('/api/train').then(x => { TRAIN = {sessions: x.sessions || {}, settings: x.settings || {}}; TRAIN_OK = true; })
      .catch(e => { if (e.status === 404) { TRAIN_OK = false; TRAIN = local || {sessions: {}, settings: {}}; } }),
  ]);
  FOOD = {day: null, entries: []};
  rerender();
  pollSync();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !SHEET) loadAll(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const startTab = (location.hash || '').replace('#', '');
showTab(startTab === 'registro' ? 'diario' : startTab === 'semana' ? 'hoy' : startTab === 'valorar' ? 'entreno' : RENDER[startTab] ? startTab : TAB);
// el aviso del domingo abre directamente el resumen semanal (también si la app ya estaba abierta)
const openFromHash = () => { if (location.hash === '#semana') { history.replaceState(null, '', location.pathname); setTimeout(() => weekSheet(dow(T()) === 0 ? 1 : 0), 300); } };
openFromHash(); window.addEventListener('hashchange', openFromHash);
loadAll();
</script>
